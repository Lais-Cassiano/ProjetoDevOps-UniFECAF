# Estrutura dos serviços
services:

  # Montar a aplicação
  pedidos:
    build: ./pedidos
    container_name: loja-veloz-pedidos
    restart: unless-stopped
    image: loja-veloz-pedidos:1.0.0

    ports:
      - "5353:5353"

    depends_on:
      - postgres

    command: npm start


  estoque:
    build: ./estoque
    container_name: loja-veloz-estoque
    restart: unless-stopped
    image: loja-veloz-estoque:1.0.0

    ports:
      - "5354:5354"

    command: npm start


  pagamentos:
    build: ./pagamentos
    container_name: loja-veloz-pagamentos
    restart: unless-stopped
    image: loja-veloz-pagamentos:1.0.0

    ports:
      - "5355:5355"

    environment:
      AMBIENTE: desenvolvimento

    command: npm start
  

  gateway:
    build: ./gateway
    container_name: loja-veloz-gateway
    restart: unless-stopped
    image: loja-veloz-gateway:1.0.0

    ports:
      - "5350:5350"

    depends_on:
      - pedidos
      - estoque
      - pagamentos

    command: npm start


  postgres:
    image: postgres:16-alpine
    container_name: loja-veloz-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: db_loja_veloz
      POSTGRES_USER: lais
      POSTGRES_PASSWORD: 12345678

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data