apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true

      containers:
        - name: gateway
          image: loja-veloz-gateway:1.0.0
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "100m"

          ports:
            - containerPort: 5350

        
          livenessProbe:
            httpGet:
              path: /pedidos
              port: 5350
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /pedidos
              port: 5350
            initialDelaySeconds: 5
            periodSeconds: 5